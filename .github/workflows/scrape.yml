name: Scrape

on:
  workflow_dispatch:
    inputs:
      containerTag:
        default: "latest"
        required: false
        description: "Container tag to use (e.g., 'latest', 'pr-123' for PR #123)"
      sendNewConfigToTg:
        description: "Send current config as config.txt via Telegram (true/false)"
        type: boolean
        required: false
        default: false
      DEBUG:
        description: "Debug logging namespace (e.g., 'moneyman:*')"
        required: false
        default: "moneyman:*"
  schedule:
    # In Israel: [12:05, 00:05] or [13:05, 01:05] on DST
    - cron: "5 10,22 * * *"
env:
  REGISTRY: ghcr.io
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      # The preflight script lives in this repo, so the runner needs a checkout.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: normalize-repository-name
        run: echo "repository=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - id: set-container-image
        run: echo "image=${{ env.REGISTRY }}/${{ steps.normalize-repository-name.outputs.repository }}:${{ github.event.inputs.containerTag || 'latest' }}" >> $GITHUB_OUTPUT

      - name: Pull container image
        run: docker pull ${{ steps.set-container-image.outputs.image }}

      # Joins the tailnet as tag:ci so the browser can reach the home proxy.
      - name: Join tailnet
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4.4.0
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          tags: tag:ci

      # Fails closed: the job stops here unless the proxy exits from the home line.
      - name: Proxy preflight
        id: proxy
        env:
          IMAGE: ${{ steps.set-container-image.outputs.image }}
          PROXY_NAME: ${{ vars.PROXY_NAME }}
          PROXY_IP: ${{ vars.PROXY_IP }}
          DDNS_HOST: ${{ vars.DDNS_HOST }}
        run: bash .github/scripts/proxy-preflight.sh "$IMAGE"

      - name: Run scraper
        env:
          IMAGE: ${{ steps.set-container-image.outputs.image }}
          MONEYMAN_CONFIG_SECRET: ${{ secrets.MONEYMAN_CONFIG }}
          PROXY: ${{ steps.proxy.outputs.proxy }}
          DEBUG: ${{ github.event.inputs.DEBUG || '' }}
          TZ: "Asia/Jerusalem"
          SEND_NEW_CONFIG_TO_TG: ${{ github.event.inputs.sendNewConfigToTg }}
        run: |
          # Use the proxy the preflight verified, so browserProxy always matches it.
          MONEYMAN_CONFIG="$(printf '%s' "$MONEYMAN_CONFIG_SECRET" | jq -c --arg p "$PROXY" '.options.scraping.browserProxy = $p')"
          export MONEYMAN_CONFIG
          docker run --rm \
            -e MONEYMAN_CONFIG \
            -e DEBUG \
            -e TZ \
            -e SEND_NEW_CONFIG_TO_TG \
            "$IMAGE"

      # The preflight failure happens before moneyman starts, so moneyman cannot
      # send its own Telegram message. Send a short one here using the same bot.
      - name: Notify on failure
        if: failure()
        env:
          MONEYMAN_CONFIG_SECRET: ${{ secrets.MONEYMAN_CONFIG }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TOKEN="$(printf '%s' "$MONEYMAN_CONFIG_SECRET" | jq -r '.options.notifications.telegram.apiKey // empty' 2>/dev/null)"
          CHAT="$(printf '%s' "$MONEYMAN_CONFIG_SECRET" | jq -r '.options.notifications.telegram.chatId // empty' 2>/dev/null)"
          if [ -z "$TOKEN" ] || [ -z "$CHAT" ]; then
            echo "No Telegram settings in MONEYMAN_CONFIG; skipping notification"
            exit 0
          fi
          curl -fsS --max-time 15 "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=Moneyman scrape failed (proxy preflight or run). ${RUN_URL}" \
            >/dev/null || echo "Telegram notification failed"
